[package]
name = "git-local-issue"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Distributed, offline-first issue tracker stored natively in Git (the `gli` command)."
license = "GPL-2.0-only"
repository = "https://github.com/0xheartcode/git-local-issue"
homepage = "https://github.com/0xheartcode/git-local-issue"
authors = ["0xheartcode"]
readme = "README.md"
keywords = ["issue-tracker", "git", "cli", "offline-first", "distributed"]
categories = ["command-line-utilities", "development-tools"]

# The package is `git-local-issue`; the installed command is `gli`.
[lib]
name = "gli"
path = "src/lib.rs"

[[bin]]
name = "gli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
uuid = { version = "1", features = ["v7"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
